<div class="container" id="stacks">
  <div class="row titulo-stack">
    <div class="col-12">
      <h1>Stacks</h1>
    </div>
  </div>

  <div class="stacks-grid">
    <div *ngFor="let item of tecnologias" class="tec">
      <i *ngIf="item.icone" [class]="item.icone + ' tec-icone'"></i>
      <p>{{ item.nome }}</p>
    </div>
  </div>
</div>

<div class="separacao-introducao">
  <hr>
</div>
